name: Software Checks

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Software Updates
        run: python check.py
        env:
          TGRAMTOKEN: ${{ secrets.TGRAMTOKEN }}
          TGRAMCHATID: ${{ secrets.TGRAMCHATID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runs even when a check failed, so the versions found by the other checks are still saved.
      - name: Commit changes
        if: ${{ !cancelled() }}
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: Update version files
          file_pattern: updates/*
          disable_globbing: true
